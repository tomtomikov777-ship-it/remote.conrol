<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RODA Remote Test</title>
    <style>
        body { font-family: Arial; background: #222; color: #fff; text-align: center; padding: 20px; }
        .display { font-size: 60px; background: #111; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .btn { font-size: 30px; padding: 15px; margin: 5px; border: none; border-radius: 10px; background: #444; color: #fff; width: 80px; }
        .btn:active { background: #666; }
    </style>
</head>
<body>
    <div class="display" id="tempDisplay">24°C</div>
    <button class="btn" onclick="changeTemp(1)">+</button>
    <button class="btn" onclick="changeTemp(-1)">-</button>
    <script>
        let temperature = 24;
        function changeTemp(delta) {
            temperature += delta;
            document.getElementById('tempDisplay').textContent = temperature + '°C';
            // Попытка отправить ИК (если есть)
            if (window.irBridge) {
                window.irBridge.sendIR(38000, [9000, 4500]);
            }
        }
        console.log('App loaded');
        alert('Test alert'); // для проверки
    </script>
</body>
</html>
