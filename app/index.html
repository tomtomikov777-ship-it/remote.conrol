 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт RODA RS‑S12A</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #3a3a3a;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 10px;
    }
    .remote {
      width: 100%;
      max-width: 340px;
      background: #f0f0f0;
      border-radius: 30px;
      padding: 16px 12px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
      border: 1px solid #b0b0b0;
    }
    .display {
      background: #1a2a1a;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 12px;
      color: #a8f0a8;
      font-family: 'Courier New', monospace;
      box-shadow: inset 0 0 10px #0a1a0a;
      border: 2px solid #555;
    }
    .display-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding-bottom: 3px;
      border-bottom: 1px dashed #3a5a3a;
    }
    .display-temp {
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      padding: 2px 0 0;
      line-height: 1;
      letter-spacing: 1px;
    }
    .display-temp span { font-size: 18px; vertical-align: super; }
    .display-mode {
      font-size: 14px;
      text-align: center;
      padding-top: 2px;
      color: #c8e8c8;
    }
    .display-extra {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #8ac88a;
      margin-top: 3px;
      border-top: 1px dashed #3a5a3a;
      padding-top: 3px;
      flex-wrap: wrap;
      gap: 2px 6px;
    }
    .display-extra span { white-space: nowrap; }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn {
      background: #e8e8e8;
      border: none;
      border-radius: 10px;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      color: #222;
      box-shadow: 0 3px 0 #b0b0b0, inset 0 1px 2px #fff;
      transition: all 0.05s ease;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0px 0 #b0b0b0, inset 0 1px 2px #fff;
    }
    .btn .icon { font-size: 16px; display: block; margin-bottom: 1px; }
    .btn .label { font-size: 9px; font-weight: normal; color: #444; }
    .btn-lg { font-size: 20px; font-weight: bold; padding: 4px 0; }
    .btn-green { background: #a0d8a0; box-shadow: 0 3px 0 #6a9a6a; }
    .btn-orange { background: #f7c97e; box-shadow: 0 3px 0 #b58a42; }
    .btn-blue { background: #8ab8e0; box-shadow: 0 3px 0 #4a7a9a; }
    .btn-red { background: #e88a8a; box-shadow: 0 3px 0 #9a5a5a; }
    .btn-purple { background: #d4a0d4; box-shadow: 0 3px 0 #8a5a8a; }
    .btn-teal { background: #8ad4c8; box-shadow: 0 3px 0 #4a8a7a; }
    .btn-pink { background: #f0b0b0; box-shadow: 0 3px 0 #a07070; }
    .btn-wide { grid-column: span 2; }
    .brand {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      color: #888;
      letter-spacing: 1px;
    }
    .lock-active .btn:not(.btn-lock) {
      opacity: 0.4;
      pointer-events: none;
    }
    .lock-active .btn-lock {
      background: #ff8888;
      box-shadow: 0 3px 0 #aa5555;
    }
    /* Панель обучения */
    .learn-panel {
      margin-top: 10px;
      padding: 8px;
      background: #ddd;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .learn-panel select {
      flex: 1;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #aaa;
    }
    .learn-panel button {
      background: #ffaa00;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .learn-panel button:active { transform: scale(0.95); }
    #learnStatus {
      font-size: 11px;
      color: #333;
      flex-basis: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="remote" id="remote">
  <!-- Дисплей -->
  <div class="display">
    <div class="display-top">
      <span id="powerStatus">🔛 Вкл</span>
      <span id="fanSpeed">💨 Авто</span>
    </div>
    <div class="display-temp" id="tempDisplay">24<span>°</span></div>
    <div class="display-mode" id="modeDisplay">❄️ Охлаждение</div>
    <div class="display-extra">
      <span id="timerDisplay">⏲ Таймер выкл</span>
      <span id="swingStatus">↕ Свинг вкл</span>
      <span id="indicatorIFeel">👤 iFeel выкл</span>
      <span id="indicatorLock">🔒 Блок выкл</span>
      <span id="indicatorHealth">❤️ Здоровье выкл</span>
      <span id="indicatorClean">🧹 Очистка выкл</span>
      <span id="indicatorQuiet">🔇 Тихий выкл</span>
      <span id="indicatorTurbo">⚡ Турбо выкл</span>
      <span id="indicatorSleep">🌙 Сон выкл</span>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="btn-grid" id="btnGrid">
    <button class="btn btn-red" onclick="handlePower()"><span class="icon">🔴</span>Вкл/Выкл</button>
    <button class="btn btn-blue" onclick="handleMode()"><span class="icon">🔄</span>Режим</button>
    <button class="btn btn-orange" onclick="handleFan()"><span class="icon">💨</span>Вент.</button>
    <button class="btn" onclick="handleSwing()"><span class="icon">↕</span>Свинг</button>

    <button class="btn btn-lg" onclick="handleTempUp()">+</button>
    <button class="btn btn-lg" onclick="handleTempDown()">−</button>
    <button class="btn" onclick="handleTurbo()"><span class="icon">⚡</span>Турбо</button>
    <button class="btn" onclick="handleSleep()"><span class="icon">🌙</span>Сон</button>

    <button class="btn btn-purple" onclick="handleIFeel()"><span class="icon">👤</span>iFeel</button>
    <button class="btn btn-teal" onclick="handleDisplay()"><span class="icon">💡</span>Дисплей</button>
    <button class="btn btn-pink" onclick="handleLock()"><span class="icon">🔒</span>Блок</button>
    <button class="btn" onclick="handleHealth()"><span class="icon">❤️</span>Здоровье</button>

    <button class="btn" onclick="handleClean()"><span class="icon">🧹</span>Очистка</button>
    <button class="btn" onclick="handleQuiet()"><span class="icon">🔇</span>Тихий</button>
    <button class="btn btn-green btn-wide" onclick="handleTimer()"><span class="icon">⏲</span>Таймер</button>
    <button class="btn btn-orange btn-wide" onclick="handleReset()"><span class="icon">↺</span>Сброс</button>
  </div>

  <!-- Панель обучения -->
  <div class="learn-panel">
    <select id="learnAction">
      <option value="power">Вкл/Выкл</option>
      <option value="mode">Режим</option>
      <option value="tempUp">Температура +</option>
      <option value="tempDown">Температура −</option>
      <option value="fan">Вентилятор</option>
      <option value="swing">Свинг</option>
      <option value="turbo">Турбо</option>
      <option value="sleep">Сон</option>
      <option value="iFeel">iFeel</option>
      <option value="display">Дисплей (подсветка)</option>
      <option value="health">Здоровье</option>
      <option value="clean">Очистка</option>
      <option value="quiet">Тихий</option>
    </select>
    <button id="learnBtn" onclick="startLearning()">🔍 Найти код</button>
    <div id="learnStatus">Выберите функцию и нажмите "Найти код"</div>
  </div>

  <div class="brand">RODA RS‑S12A</div>
</div>

<script>
  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ СОСТОЯНИЯ
  // ============================================================
  let power = true;
  let temperature = 24;
  let modeIndex = 0;
  const modes = ['❄️ Охлаждение', '☀️ Обогрев', '💨 Вентиляция', '💧 Осушение', '🔄 Авто'];
  let fanIndex = 0;
  const fanNames = ['Авто','Низк','Сред','Выс'];
  let swing = true;
  let turbo = false;
  let sleep = false;
  let timerMinutes = 0;
  let timerInterval = null;
  let iFeel = false;
  let displayLight = true;
  let locked = false;
  let health = false;
  let clean = false;
  let quiet = false;

  // Хранилище кодов (ключ – название действия)
  let savedCodes = {
    power: null, mode: null, tempUp: null, tempDown: null, fan: null,
    swing: null, turbo: null, sleep: null, iFeel: null, display: null,
    health: null, clean: null, quiet: null
  };

  // ============================================================
  //  БАЗА ВОЗМОЖНЫХ КОДОВ ДЛЯ RODA (Midea)
  // ============================================================
  // Для каждой функции задаём массив возможных комбинаций (address, command)
  const codeDatabase = {
    power:   [{a:0x00,c:0x21}, {a:0x01,c:0x21}, {a:0x02,c:0x21}, {a:0x00,c:0x22}, {a:0x01,c:0x22}],
    mode:    [{a:0x00,c:0x22}, {a:0x01,c:0x22}, {a:0x00,c:0x23}],
    tempUp:  [{a:0x00,c:0x23}, {a:0x01,c:0x23}],
    tempDown:[{a:0x00,c:0x24}, {a:0x01,c:0x24}],
    fan:     [{a:0x00,c:0x25}, {a:0x01,c:0x25}],
    swing:   [{a:0x00,c:0x26}, {a:0x01,c:0x26}],
    turbo:   [{a:0x00,c:0x27}, {a:0x01,c:0x27}],
    sleep:   [{a:0x00,c:0x28}, {a:0x01,c:0x28}],
    iFeel:   [{a:0x00,c:0x29}, {a:0x01,c:0x29}],
    display: [{a:0x00,c:0x2A}, {a:0x01,c:0x2A}],
    health:  [{a:0x00,c:0x2B}, {a:0x01,c:0x2B}],
    clean:   [{a:0x00,c:0x2C}, {a:0x01,c:0x2C}],
    quiet:   [{a:0x00,c:0x2D}, {a:0x01,c:0x2D}]
  };

  // ============================================================
  //  ЗАГРУЗКА / СОХРАНЕНИЕ КОДОВ В localStorage
  // ============================================================
  function loadCodes() {
    try {
      const data = localStorage.getItem('roda_codes');
      if (data) {
        const parsed = JSON.parse(data);
        for (let key in parsed) {
          if (savedCodes.hasOwnProperty(key)) {
            savedCodes[key] = parsed[key];
          }
        }
      }
    } catch (e) {}
  }
  function saveCodes() {
    try {
      localStorage.setItem('roda_codes', JSON.stringify(savedCodes));
    } catch (e) {}
  }

  // ============================================================
  //  ЭЛЕМЕНТЫ DOM
  // ============================================================
  const tempDisplay = document.getElementById('tempDisplay');
  const modeDisplay = document.getElementById('modeDisplay');
  const fanSpeed = document.getElementById('fanSpeed');
  const powerStatus = document.getElementById('powerStatus');
  const timerDisplay = document.getElementById('timerDisplay');
  const swingStatus = document.getElementById('swingStatus');
  const indicatorIFeel = document.getElementById('indicatorIFeel');
  const indicatorLock = document.getElementById('indicatorLock');
  const indicatorHealth = document.getElementById('indicatorHealth');
  const indicatorClean = document.getElementById('indicatorClean');
  const indicatorQuiet = document.getElementById('indicatorQuiet');
  const indicatorTurbo = document.getElementById('indicatorTurbo');
  const indicatorSleep = document.getElementById('indicatorSleep');
  const btnGrid = document.getElementById('btnGrid');
  const learnStatus = document.getElementById('learnStatus');
  const learnAction = document.getElementById('learnAction');
  const learnBtn = document.getElementById('learnBtn');

  // ============================================================
  //  ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
  // ============================================================
  function updateUI() {
    if (locked) btnGrid.classList.add('lock-active');
    else btnGrid.classList.remove('lock-active');

    if (!power) {
      tempDisplay.innerHTML = 'OFF';
      modeDisplay.textContent = 'Выключен';
      powerStatus.textContent = '⛔ Выкл';
      fanSpeed.textContent = '—';
      timerDisplay.textContent = '⏲ Таймер выкл';
      swingStatus.textContent = '↕ —';
      indicatorIFeel.textContent = '👤 iFeel выкл';
      indicatorLock.textContent = '🔒 Блок выкл';
      indicatorHealth.textContent = '❤️ Здоровье выкл';
      indicatorClean.textContent = '🧹 Очистка выкл';
      indicatorQuiet.textContent = '🔇 Тихий выкл';
      indicatorTurbo.textContent = '⚡ Турбо выкл';
      indicatorSleep.textContent = '🌙 Сон выкл';
      return;
    }
    tempDisplay.innerHTML = temperature + '<span>°</span>';
    modeDisplay.textContent = modes[modeIndex];
    powerStatus.textContent = '🔛 Вкл';
    fanSpeed.textContent = '💨 ' + fanNames[fanIndex];
    swingStatus.textContent = swing ? '↕ Свинг вкл' : '↕ Свинг выкл';
    indicatorTurbo.textContent = turbo ? '⚡ Турбо вкл' : '⚡ Турбо выкл';
    indicatorSleep.textContent = sleep ? '🌙 Сон вкл' : '🌙 Сон выкл';
    indicatorIFeel.textContent = iFeel ? '👤 iFeel вкл' : '👤 iFeel выкл';
    indicatorLock.textContent = locked ? '🔒 Блок вкл' : '🔒 Блок выкл';
    indicatorHealth.textContent = health ? '❤️ Здоровье вкл' : '❤️ Здоровье выкл';
    indicatorClean.textContent = clean ? '🧹 Очистка вкл' : '🧹 Очистка выкл';
    indicatorQuiet.textContent = quiet ? '🔇 Тихий вкл' : '🔇 Тихий выкл';
    if (timerMinutes > 0) {
      const h = Math.floor(timerMinutes / 60);
      const m = timerMinutes % 60;
      timerDisplay.textContent = '⏲ Таймер ' + (h > 0 ? h + 'ч ' : '') + m + 'м';
    } else {
      timerDisplay.textContent = '⏲ Таймер выкл';
    }
  }

  // ============================================================
  //  ОТПРАВКА ИК-СИГНАЛА
  // ============================================================
  function sendIRCode(frequency, pattern) {
    if (window.irBridge) {
      window.irBridge.sendIR(frequency, pattern);
      console.log('📡 ИК отправлен, длина паттерна ' + pattern.length);
    } else {
      console.warn('⚠️ irBridge не доступен');
    }
  }

  // ============================================================
  //  ГЕНЕРАЦИЯ NEC-ПАТТЕРНА
  // ============================================================
  function necPattern(address, command) {
    const bits = [9000, 4500];
    let addr = address & 0xFF;
    let invAddr = (~addr) & 0xFF;
    for (let i = 0; i < 8; i++) {
      bits.push(560, (addr & (1 << i)) ? 1690 : 560);
    }
    for (let i = 0; i < 8; i++) {
      bits.push(560, (invAddr & (1 << i)) ? 1690 : 560);
    }
    let cmd = command & 0xFF;
    let invCmd = (~cmd) & 0xFF;
    for (let i = 0; i < 8; i++) {
      bits.push(560, (cmd & (1 << i)) ? 1690 : 560);
    }
    for (let i = 0; i < 8; i++) {
      bits.push(560, (invCmd & (1 << i)) ? 1690 : 560);
    }
    bits.push(560);
    return bits;
  }

  // ============================================================
  //  УНИВЕРСАЛЬНЫЙ АВТОПОИСК ДЛЯ ЛЮБОЙ ФУНКЦИИ
  // ============================================================
  let learningActive = false;
  let learnIndex = 0;
  let learnTimer = null;
  let currentAction = null;

  function startLearning() {
    const action = learnAction.value;
    if (!codeDatabase[action]) {
      learnStatus.textContent = '❌ Нет базы для этой функции';
      return;
    }
    if (learningActive) {
      // Если уже идёт обучение – останавливаем
      stopLearning('Остановлено пользователем');
      return;
    }
    // Проверяем, есть ли уже сохранённый код
    if (savedCodes[action]) {
      if (!confirm('Код для "' + learnAction.options[learnAction.selectedIndex].text + '" уже найден. Перезаписать?')) {
        return;
      }
      savedCodes[action] = null;
      saveCodes();
    }

    learningActive = true;
    learnIndex = 0;
    currentAction = action;
    learnBtn.textContent = '⏹ Остановить';
    learnStatus.textContent = 'Поиск для "' + learnAction.options[learnAction.selectedIndex].text + '"... (0/' + codeDatabase[action].length + ')';
    nextLearnCode();
  }

  function nextLearnCode() {
    if (!learningActive || learnIndex >= codeDatabase[currentAction].length) {
      stopLearning('❌ Коды закончились, не найдено');
      return;
    }
    const entry = codeDatabase[currentAction][learnIndex];
    const pattern = necPattern(entry.a, entry.c);
    sendIRCode(38000, pattern);
    console.log('Отправлен код #' + learnIndex + ': адрес=' + entry.a + ', команда=' + entry.c);

    learnStatus.textContent = 'Поиск... (' + (learnIndex+1) + '/' + codeDatabase[currentAction].length + ')';

    learnTimer = setTimeout(() => {
      if (!learningActive) return;
      const userConfirm = confirm('Кондиционер отреагировал? (код #' + (learnIndex+1) + ')');
      if (userConfirm) {
        savedCodes[currentAction] = { address: entry.a, command: entry.c };
        saveCodes();
        stopLearning('✅ Код найден! адрес=' + entry.a + ', команда=' + entry.c);
        alert('Код сохранён для "' + learnAction.options[learnAction.selectedIndex].text + '"');
      } else {
        learnIndex++;
        nextLearnCode();
      }
    }, 3000);
  }

  function stopLearning(message) {
    learningActive = false;
    if (learnTimer) {
      clearTimeout(learnTimer);
      learnTimer = null;
    }
    learnStatus.textContent = message || 'Поиск остановлен';
    learnBtn.textContent = '🔍 Найти код';
  }

  // ============================================================
  //  ОТПРАВКА СОХРАНЁННОГО КОДА (для кнопок)
  // ============================================================
  function sendSavedCode(action) {
    const code = savedCodes[action];
    if (code) {
      const pattern = necPattern(code.address, code.command);
      sendIRCode(38000, pattern);
      return true;
    } else {
      console.warn('Код для ' + action + ' не найден');
      return false;
    }
  }

  // ============================================================
  //  ОБРАБОТЧИКИ КНОПОК
  // ============================================================
  function handlePower() {
    if (locked) return;
    power = !power;
    if (!power && timerInterval) { clearInterval(timerInterval); timerInterval = null; timerMinutes = 0; }
    updateUI();
    if (!sendSavedCode('power')) alert('Код для включения не найден. Используйте обучение.');
  }
  function handleTempUp() {
    if (locked || !power) return;
    if (temperature < 32) temperature++;
    updateUI();
    if (!sendSavedCode('tempUp')) alert('Код для + не найден.');
  }
  function handleTempDown() {
    if (locked || !power) return;
    if (temperature > 16) temperature--;
    updateUI();
    if (!sendSavedCode('tempDown')) alert('Код для − не найден.');
  }
  function handleMode() {
    if (locked || !power) return;
    modeIndex = (modeIndex + 1) % modes.length;
    updateUI();
    if (!sendSavedCode('mode')) alert('Код для режима не найден.');
  }
  function handleFan() {
    if (locked || !power) return;
    fanIndex = (fanIndex + 1) % fanNames.length;
    updateUI();
    if (!sendSavedCode('fan')) alert('Код для вентилятора не найден.');
  }
  function handleSwing() {
    if (locked || !power) return;
    swing = !swing;
    updateUI();
    if (!sendSavedCode('swing')) alert('Код для свинга не найден.');
  }
  function handleTurbo() {
    if (locked || !power) return;
    turbo = !turbo;
    updateUI();
    if (!sendSavedCode('turbo')) alert('Код для турбо не найден.');
  }
  function handleSleep() {
    if (locked || !power) return;
    sleep = !sleep;
    updateUI();
    if (!sendSavedCode('sleep')) alert('Код для сна не найден.');
  }
  function handleIFeel() {
    if (locked || !power) return;
    iFeel = !iFeel;
    updateUI();
    if (!sendSavedCode('iFeel')) alert('Код для iFeel не найден.');
  }
  function handleDisplay() {
    if (locked || !power) return;
    displayLight = !displayLight;
    alert('Подсветка внутреннего блока ' + (displayLight ? 'включена' : 'выключена'));
    if (!sendSavedCode('display')) alert('Код для дисплея не найден.');
  }
  function handleLock() {
    locked = !locked;
    updateUI();
    alert(locked ? 'Кнопки заблокированы' : 'Блокировка снята');
  }
  function handleHealth() {
    if (locked || !power) return;
    health = !health;
    updateUI();
    if (!sendSavedCode('health')) alert('Код для здоровья не найден.');
  }
  function handleClean() {
    if (locked || !power) return;
    clean = !clean;
    updateUI();
    if (!sendSavedCode('clean')) alert('Код для очистки не найден.');
  }
  function handleQuiet() {
    if (locked || !power) return;
    quiet = !quiet;
    updateUI();
    if (!sendSavedCode('quiet')) alert('Код для тихого режима не найден.');
  }
  function handleTimer() {
    if (locked || !power) return;
    let val = prompt('Введите время в минутах (0 – выключить):', timerMinutes || '0');
    if (val === null) return;
    let mins = parseInt(val);
    if (isNaN(mins) || mins < 0) mins = 0;
    timerMinutes = mins;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (timerMinutes > 0) {
      timerInterval = setInterval(() => {
        timerMinutes--;
        if (timerMinutes <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          power = false;
          updateUI();
        } else {
          updateUI();
        }
      }, 60000);
      alert('Таймер установлен на ' + timerMinutes + ' мин');
    } else {
      alert('Таймер выключен');
    }
    updateUI();
  }
  function handleReset() {
    if (locked) return;
    power = true;
    temperature = 24;
    modeIndex = 0;
    fanIndex = 0;
    swing = true;
    turbo = false;
    sleep = false;
    iFeel = false;
    displayLight = true;
    health = false;
    clean = false;
    quiet = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerMinutes = 0;
    locked = false;
    updateUI();
    alert('Настройки сброшены');
  }

  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  loadCodes();
  updateUI();
  console.log('Пульт RODA загружен. Сохранённые коды:', savedCodes);
</script>
