<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт RODA RS‑S12A</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #3a3a3a;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 10px;
    }
    .remote {
      width: 100%;
      max-width: 340px;
      background: #f0f0f0;
      border-radius: 30px;
      padding: 16px 12px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
      border: 1px solid #b0b0b0;
    }
    .display {
      background: #1a2a1a;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 12px;
      color: #a8f0a8;
      font-family: 'Courier New', monospace;
      box-shadow: inset 0 0 10px #0a1a0a;
      border: 2px solid #555;
    }
    .display-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding-bottom: 3px;
      border-bottom: 1px dashed #3a5a3a;
    }
    .display-temp {
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      padding: 2px 0 0;
      line-height: 1;
      letter-spacing: 1px;
    }
    .display-temp span { font-size: 18px; vertical-align: super; }
    .display-mode {
      font-size: 14px;
      text-align: center;
      padding-top: 2px;
      color: #c8e8c8;
    }
    .display-extra {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #8ac88a;
      margin-top: 3px;
      border-top: 1px dashed #3a5a3a;
      padding-top: 3px;
      flex-wrap: wrap;
      gap: 2px 6px;
    }
    .display-extra span { white-space: nowrap; }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn {
      background: #e8e8e8;
      border: none;
      border-radius: 10px;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      color: #222;
      box-shadow: 0 3px 0 #b0b0b0, inset 0 1px 2px #fff;
      transition: all 0.05s ease;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0px 0 #b0b0b0, inset 0 1px 2px #fff;
    }
    .btn .icon { font-size: 16px; display: block; margin-bottom: 1px; }
    .btn .label { font-size: 9px; font-weight: normal; color: #444; }
    .btn-lg { font-size: 20px; font-weight: bold; padding: 4px 0; }
    .btn-green { background: #a0d8a0; box-shadow: 0 3px 0 #6a9a6a; }
    .btn-orange { background: #f7c97e; box-shadow: 0 3px 0 #b58a42; }
    .btn-blue { background: #8ab8e0; box-shadow: 0 3px 0 #4a7a9a; }
    .btn-red { background: #e88a8a; box-shadow: 0 3px 0 #9a5a5a; }
    .btn-purple { background: #d4a0d4; box-shadow: 0 3px 0 #8a5a8a; }
    .btn-teal { background: #8ad4c8; box-shadow: 0 3px 0 #4a8a7a; }
    .btn-pink { background: #f0b0b0; box-shadow: 0 3px 0 #a07070; }
    .btn-wide { grid-column: span 2; }
    .brand {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      color: #888;
      letter-spacing: 1px;
    }
    /* Индикатор блокировки */
    .lock-active .btn:not(.btn-lock) {
      opacity: 0.4;
      pointer-events: none;
    }
    .lock-active .btn-lock {
      background: #ff8888;
      box-shadow: 0 3px 0 #aa5555;
    }
  </style>
</head>
<body>
<div class="remote" id="remote">
  <!-- Дисплей -->
  <div class="display">
    <div class="display-top">
      <span id="powerStatus">🔛 Вкл</span>
      <span id="fanSpeed">💨 Авто</span>
    </div>
    <div class="display-temp" id="tempDisplay">24<span>°</span></div>
    <div class="display-mode" id="modeDisplay">❄️ Охлаждение</div>
    <div class="display-extra">
      <span id="timerDisplay">⏲ Таймер выкл</span>
      <span id="swingStatus">↕ Свинг вкл</span>
      <span id="indicatorIFeel">👤 iFeel выкл</span>
      <span id="indicatorLock">🔒 Блок выкл</span>
      <span id="indicatorHealth">❤️ Здоровье выкл</span>
      <span id="indicatorClean">🧹 Очистка выкл</span>
      <span id="indicatorQuiet">🔇 Тихий выкл</span>
      <span id="indicatorTurbo">⚡ Турбо выкл</span>
      <span id="indicatorSleep">🌙 Сон выкл</span>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="btn-grid" id="btnGrid">
    <button class="btn btn-red" onclick="handlePower()"><span class="icon">🔴</span>Вкл/Выкл</button>
    <button class="btn btn-blue" onclick="handleMode()"><span class="icon">🔄</span>Режим</button>
    <button class="btn btn-orange" onclick="handleFan()"><span class="icon">💨</span>Вент.</button>
    <button class="btn" onclick="handleSwing()"><span class="icon">↕</span>Свинг</button>

    <button class="btn btn-lg" onclick="handleTempUp()">+</button>
    <button class="btn btn-lg" onclick="handleTempDown()">−</button>
    <button class="btn" onclick="handleTurbo()"><span class="icon">⚡</span>Турбо</button>
    <button class="btn" onclick="handleSleep()"><span class="icon">🌙</span>Сон</button>

    <button class="btn btn-purple" onclick="handleIFeel()"><span class="icon">👤</span>iFeel</button>
    <button class="btn btn-teal" onclick="handleDisplay()"><span class="icon">💡</span>Дисплей</button>
    <button class="btn btn-pink" onclick="handleLock()"><span class="icon">🔒</span>Блок</button>
    <button class="btn" onclick="handleHealth()"><span class="icon">❤️</span>Здоровье</button>

    <button class="btn" onclick="handleClean()"><span class="icon">🧹</span>Очистка</button>
    <button class="btn" onclick="handleQuiet()"><span class="icon">🔇</span>Тихий</button>
    <button class="btn btn-green btn-wide" onclick="handleTimer()"><span class="icon">⏲</span>Таймер</button>
    <button class="btn btn-orange btn-wide" onclick="handleReset()"><span class="icon">↺</span>Сброс</button>
  </div>
  <div class="brand">RODA RS‑S12A</div>
</div>

<script>
  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ СОСТОЯНИЯ
  // ============================================================
  let power = true;
  let temperature = 24;
  let modeIndex = 0;              // 0-охлаждение,1-обогрев,2-вентиляция,3-осушение,4-авто
  const modes = ['❄️ Охлаждение', '☀️ Обогрев', '💨 Вентиляция', '💧 Осушение', '🔄 Авто'];
  let fanIndex = 0;              // 0-Авто,1-Низк,2-Сред,3-Выс
  const fanNames = ['Авто','Низк','Сред','Выс'];
  let swing = true;
  let turbo = false;
  let sleep = false;
  let timerMinutes = 0;
  let timerInterval = null;
  let iFeel = false;
  let displayLight = true;
  let locked = false;
  let health = false;
  let clean = false;
  let quiet = false;

  // ============================================================
  //  ЭЛЕМЕНТЫ DOM
  // ============================================================
  const tempDisplay = document.getElementById('tempDisplay');
  const modeDisplay = document.getElementById('modeDisplay');
  const fanSpeed = document.getElementById('fanSpeed');
  const powerStatus = document.getElementById('powerStatus');
  const timerDisplay = document.getElementById('timerDisplay');
  const swingStatus = document.getElementById('swingStatus');
  const indicatorIFeel = document.getElementById('indicatorIFeel');
  const indicatorLock = document.getElementById('indicatorLock');
  const indicatorHealth = document.getElementById('indicatorHealth');
  const indicatorClean = document.getElementById('indicatorClean');
  const indicatorQuiet = document.getElementById('indicatorQuiet');
  const indicatorTurbo = document.getElementById('indicatorTurbo');
  const indicatorSleep = document.getElementById('indicatorSleep');
  const btnGrid = document.getElementById('btnGrid');

  // ============================================================
  //  ФУНКЦИЯ ОБНОВЛЕНИЯ ИНТЕРФЕЙСА
  // ============================================================
  function updateUI() {
    // Блокировка
    if (locked) {
      btnGrid.classList.add('lock-active');
    } else {
      btnGrid.classList.remove('lock-active');
    }

    if (!power) {
      tempDisplay.innerHTML = 'OFF';
      modeDisplay.textContent = 'Выключен';
      powerStatus.textContent = '⛔ Выкл';
      fanSpeed.textContent = '—';
      timerDisplay.textContent = '⏲ Таймер выкл';
      swingStatus.textContent = '↕ —';
      indicatorIFeel.textContent = '👤 iFeel выкл';
      indicatorLock.textContent = '🔒 Блок выкл';
      indicatorHealth.textContent = '❤️ Здоровье выкл';
      indicatorClean.textContent = '🧹 Очистка выкл';
      indicatorQuiet.textContent = '🔇 Тихий выкл';
      indicatorTurbo.textContent = '⚡ Турбо выкл';
      indicatorSleep.textContent = '🌙 Сон выкл';
      return;
    }

    // Основные параметры
    tempDisplay.innerHTML = temperature + '<span>°</span>';
    modeDisplay.textContent = modes[modeIndex];
    powerStatus.textContent = '🔛 Вкл';
    fanSpeed.textContent = '💨 ' + fanNames[fanIndex];
    swingStatus.textContent = swing ? '↕ Свинг вкл' : '↕ Свинг выкл';
    indicatorTurbo.textContent = turbo ? '⚡ Турбо вкл' : '⚡ Турбо выкл';
    indicatorSleep.textContent = sleep ? '🌙 Сон вкл' : '🌙 Сон выкл';
    indicatorIFeel.textContent = iFeel ? '👤 iFeel вкл' : '👤 iFeel выкл';
    indicatorLock.textContent = locked ? '🔒 Блок вкл' : '🔒 Блок выкл';
    indicatorHealth.textContent = health ? '❤️ Здоровье вкл' : '❤️ Здоровье выкл';
    indicatorClean.textContent = clean ? '🧹 Очистка вкл' : '🧹 Очистка выкл';
    indicatorQuiet.textContent = quiet ? '🔇 Тихий вкл' : '🔇 Тихий выкл';

    // Таймер
    if (timerMinutes > 0) {
      const h = Math.floor(timerMinutes / 60);
      const m = timerMinutes % 60;
      timerDisplay.textContent = '⏲ Таймер ' + (h > 0 ? h + 'ч ' : '') + m + 'м';
    } else {
      timerDisplay.textContent = '⏲ Таймер выкл';
    }
  }

  // ============================================================
  //  ОТПРАВКА ИК-СИГНАЛА (заглушка)
  // ============================================================
  function sendIRCode(frequency, pattern) {
    if (window.irBridge) {
      window.irBridge.sendIR(frequency, pattern);
      console.log('📡 ИК отправлен');
    } else {
      console.warn('⚠️ irBridge не доступен');
    }
  }

  // ============================================================
  //  ОБРАБОТЧИКИ СОБЫТИЙ КНОПОК
  // ============================================================
  function handlePower() {
    if (locked) return;
    power = !power;
    if (!power && timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerMinutes = 0;
    }
    updateUI();
    // Отправка ИК (замените паттерн на реальный)
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 1690]);
  }

  function handleTempUp() {
    if (locked || !power) return;
    if (temperature < 32) temperature++;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 1690, 560, 560, 560, 560]);
  }

  function handleTempDown() {
    if (locked || !power) return;
    if (temperature > 16) temperature--;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 1690, 560, 560]);
  }

  function handleMode() {
    if (locked || !power) return;
    modeIndex = (modeIndex + 1) % modes.length;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 560, 560, 1690]);
  }

  function handleFan() {
    if (locked || !power) return;
    fanIndex = (fanIndex + 1) % fanNames.length;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 1690, 560, 560, 560, 560]);
  }

  function handleSwing() {
    if (locked || !power) return;
    swing = !swing;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 1690, 560, 560]);
  }

  function handleTurbo() {
    if (locked || !power) return;
    turbo = !turbo;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 1690, 560, 1690, 560, 560]);
  }

  function handleSleep() {
    if (locked || !power) return;
    sleep = !sleep;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 1690, 560, 1690]);
  }

  function handleIFeel() {
    if (locked || !power) return;
    iFeel = !iFeel;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 1690, 560, 1690]);
  }

  function handleDisplay() {
    if (locked || !power) return;
    displayLight = !displayLight;
    alert('Подсветка внутреннего блока ' + (displayLight ? 'включена' : 'выключена'));
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 560, 560, 560]);
  }

  function handleLock() {
    locked = !locked;
    updateUI();
    alert(locked ? 'Кнопки заблокированы' : 'Блокировка снята');
  }

  function handleHealth() {
    if (locked || !power) return;
    health = !health;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 1690, 560, 560, 560, 560]);
  }

  function handleClean() {
    if (locked || !power) return;
    clean = !clean;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 1690, 560, 560]);
  }

  function handleQuiet() {
    if (locked || !power) return;
    quiet = !quiet;
    updateUI();
    sendIRCode(38000, [9000, 4500, 560, 560, 560, 560, 560, 1690]);
  }

  function handleTimer() {
    if (locked || !power) return;
    let val = prompt('Введите время в минутах (0 – выключить):', timerMinutes || '0');
    if (val === null) return;
    let mins = parseInt(val);
    if (isNaN(mins) || mins < 0) mins = 0;
    timerMinutes = mins;
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    if (timerMinutes > 0) {
      timerInterval = setInterval(() => {
        timerMinutes--;
        if (timerMinutes <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          power = false;
          updateUI();
        } else {
          updateUI();
        }
      }, 60000);
      alert('Таймер установлен на ' + timerMinutes + ' мин');
    } else {
      alert('Таймер выключен');
    }
    updateUI();
  }

  function handleReset() {
    if (locked) return;
    // Сброс всех настроек
    power = true;
    temperature = 24;
    modeIndex = 0;
    fanIndex = 0;
    swing = true;
    turbo = false;
    sleep = false;
    iFeel = false;
    displayLight = true;
    health = false;
    clean = false;
    quiet = false;
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerMinutes = 0;
    locked = false;
    updateUI();
    alert('Настройки сброшены');
  }

  // ============================================================
  //  ПЕРВОНАЧАЛЬНОЕ ОБНОВЛЕНИЕ
  // ============================================================
  updateUI();
  console.log('Пульт RODA загружен');
  // Проверка наличия irBridge через 2 секунды после загрузки
setTimeout(function() {
    if (window.irBridge) {
        console.log('✅ irBridge найден!');
        alert('IR bridge доступен!'); // временно для проверки
    } else {
        console.warn('❌ irBridge отсутствует');
        alert('IR bridge НЕ найден!');
    }
}, 2000);
</script>
</body>
</html>
