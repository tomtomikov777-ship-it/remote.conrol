 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Универсальный пульт</title>
  <style>
    /* Общие стили */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 10px;
      transition: background 0.3s, color 0.3s;
    }
    /* Светлая тема (по умолчанию) */
    body.light {
      background: #e0e0e0;
      color: #222;
    }
    body.dark {
      background: #1a1a1a;
      color: #eee;
    }
    .remote {
      width: 100%;
      max-width: 340px;
      border-radius: 30px;
      padding: 16px 12px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
      transition: background 0.3s, border 0.3s;
    }
    body.light .remote {
      background: #f0f0f0;
      border: 1px solid #b0b0b0;
    }
    body.dark .remote {
      background: #2a2a2a;
      border: 1px solid #555;
    }
    /* Дисплей */
    .display {
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      border: 2px solid #555;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    body.light .display {
      background: #1a2a1a;
      color: #a8f0a8;
      border-color: #555;
    }
    body.dark .display {
      background: #0a1a0a;
      color: #b0f0b0;
      border-color: #777;
    }
    .display-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding-bottom: 3px;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
    }
    .display-temp {
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      padding: 2px 0 0;
      line-height: 1;
      letter-spacing: 1px;
    }
    .display-temp span { font-size: 18px; vertical-align: super; }
    .display-mode {
      font-size: 14px;
      text-align: center;
      padding-top: 2px;
    }
    .display-extra {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      margin-top: 3px;
      border-top: 1px dashed rgba(255,255,255,0.2);
      padding-top: 3px;
      flex-wrap: wrap;
      gap: 2px 6px;
    }
    .display-extra span { white-space: nowrap; }
    /* Кнопки */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.5);
      transition: all 0.05s ease;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    body.light .btn {
      background: #e8e8e8;
      color: #222;
    }
    body.dark .btn {
      background: #3a3a3a;
      color: #eee;
      box-shadow: 0 3px 0 #1a1a1a;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0px 0 rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.5);
    }
    .btn .icon { font-size: 16px; display: block; margin-bottom: 1px; }
    .btn .label { font-size: 9px; font-weight: normal; opacity: 0.8; }
    .btn-lg { font-size: 20px; font-weight: bold; padding: 4px 0; }
    .btn-green { background: #a0d8a0; color: #222; }
    .btn-orange { background: #f7c97e; color: #222; }
    .btn-blue { background: #8ab8e0; color: #222; }
    .btn-red { background: #e88a8a; color: #222; }
    .btn-purple { background: #d4a0d4; color: #222; }
    .btn-teal { background: #8ad4c8; color: #222; }
    .btn-pink { background: #f0b0b0; color: #222; }
    .btn-wide { grid-column: span 2; }
    body.dark .btn-green { background: #4a7a4a; color: #eee; }
    body.dark .btn-orange { background: #8a6a2a; color: #eee; }
    body.dark .btn-blue { background: #2a5a7a; color: #eee; }
    body.dark .btn-red { background: #7a3a3a; color: #eee; }
    body.dark .btn-purple { background: #5a3a5a; color: #eee; }
    body.dark .btn-teal { background: #2a5a5a; color: #eee; }
    body.dark .btn-pink { background: #6a3a3a; color: #eee; }

    .brand {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      opacity: 0.6;
      letter-spacing: 1px;
    }
    .lock-active .btn:not(.btn-lock) {
      opacity: 0.4;
      pointer-events: none;
    }
    .lock-active .btn-lock {
      background: #ff8888;
      box-shadow: 0 3px 0 #aa5555;
    }
    /* Панель обучения и настроек */
    .bottom-panel {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }
    .settings-toggle {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    body.light .settings-toggle { color: #333; }
    body.dark .settings-toggle { color: #ddd; }
    .settings-panel {
      width: 100%;
      background: rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 10px;
      margin-top: 6px;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    body.dark .settings-panel { background: rgba(255,255,255,0.05); }
    .settings-panel.open { display: flex; }
    .settings-panel select, .settings-panel input[type="color"] {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #fff;
      color: #222;
    }
    body.dark .settings-panel select, body.dark .settings-panel input[type="color"] {
      background: #333;
      color: #eee;
      border-color: #555;
    }
    .settings-panel label {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .settings-panel input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    #learnStatus {
      width: 100%;
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }
  </style>
</head>
<body class="light">
<div class="remote" id="remote">
  <!-- Дисплей -->
  <div class="display" id="display">
    <div class="display-top">
      <span id="powerStatus">🔛 Вкл</span>
      <span id="fanSpeed">💨 Авто</span>
    </div>
    <div class="display-temp" id="tempDisplay">24<span>°</span></div>
    <div class="display-mode" id="modeDisplay">❄️ Охлаждение</div>
    <div class="display-extra">
      <span id="timerDisplay">⏲ Таймер выкл</span>
      <span id="swingStatus">↕ Свинг вкл</span>
      <span id="indicatorIFeel">👤 iFeel выкл</span>
      <span id="indicatorLock">🔒 Блок выкл</span>
      <span id="indicatorHealth">❤️ Здоровье выкл</span>
      <span id="indicatorClean">🧹 Очистка выкл</span>
      <span id="indicatorQuiet">🔇 Тихий выкл</span>
      <span id="indicatorTurbo">⚡ Турбо выкл</span>
      <span id="indicatorSleep">🌙 Сон выкл</span>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="btn-grid" id="btnGrid">
    <button class="btn btn-red" onclick="handlePower()"><span class="icon">🔴</span>Вкл/Выкл</button>
    <button class="btn btn-blue" onclick="handleMode()"><span class="icon">🔄</span>Режим</button>
    <button class="btn btn-orange" onclick="handleFan()"><span class="icon">💨</span>Вент.</button>
    <button class="btn" onclick="handleSwing()"><span class="icon">↕</span>Свинг</button>

    <button class="btn btn-lg" onclick="handleTempUp()">+</button>
    <button class="btn btn-lg" onclick="handleTempDown()">−</button>
    <button class="btn" onclick="handleTurbo()"><span class="icon">⚡</span>Турбо</button>
    <button class="btn" onclick="handleSleep()"><span class="icon">🌙</span>Сон</button>

    <button class="btn btn-purple" onclick="handleIFeel()"><span class="icon">👤</span>iFeel</button>
    <button class="btn btn-teal" onclick="handleDisplay()"><span class="icon">💡</span>Дисплей</button>
    <button class="btn btn-pink" onclick="handleLock()"><span class="icon">🔒</span>Блок</button>
    <button class="btn" onclick="handleHealth()"><span class="icon">❤️</span>Здоровье</button>

    <button class="btn" onclick="handleClean()"><span class="icon">🧹</span>Очистка</button>
    <button class="btn" onclick="handleQuiet()"><span class="icon">🔇</span>Тихий</button>
    <button class="btn btn-green btn-wide" onclick="handleTimer()"><span class="icon">⏲</span>Таймер</button>
    <button class="btn btn-orange btn-wide" onclick="handleReset()"><span class="icon">↺</span>Сброс</button>
  </div>

  <!-- Нижняя панель: настройки + обучение -->
  <div class="bottom-panel">
    <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>
    <div style="display:flex; gap:6px; align-items:center;">
      <select id="brandSelect" onchange="changeBrand()">
        <option value="roda">RODA</option>
        <option value="midea">Midea</option>
        <option value="gree">Gree</option>
        <option value="ballu">Ballu</option>
        <option value="samsung">Samsung</option>
        <option value="lg">LG</option>
        <option value="panasonic">Panasonic</option>
        <option value="hisense">Hisense</option>
        <option value="haier">Haier</option>
        <option value="tcl">TCL</option>
        <option value="electrolux">Electrolux</option>
        <option value="zanussi">Zanussi</option>
        <option value="universal">Универсальный</option>
      </select>
      <button id="learnBtn" onclick="startLearning()">🔍 Найти код</button>
    </div>
    <div id="learnStatus">Выберите функцию в настройках</div>
  </div>

  <!-- Панель настроек (скрыта) -->
  <div class="settings-panel" id="settingsPanel">
    <label>Тема:
      <select id="themeSelect" onchange="changeTheme()">
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
      </select>
    </label>
    <label>Цвет дисплея:
      <input type="color" id="displayColor" value="#a8f0a8" onchange="changeDisplayColor()">
    </label>
    <label>Вибро:
      <input type="checkbox" id="vibroCheck" onchange="saveSettings()">
    </label>
    <label>Звук:
      <input type="checkbox" id="soundCheck" onchange="saveSettings()">
    </label>
    <label>Функция для обучения:
      <select id="learnAction">
        <option value="power">Вкл/Выкл</option>
        <option value="mode">Режим</option>
        <option value="tempUp">Температура +</option>
        <option value="tempDown">Температура −</option>
        <option value="fan">Вентилятор</option>
        <option value="swing">Свинг</option>
        <option value="turbo">Турбо</option>
        <option value="sleep">Сон</option>
        <option value="iFeel">iFeel</option>
        <option value="display">Дисплей (подсветка)</option>
        <option value="health">Здоровье</option>
        <option value="clean">Очистка</option>
        <option value="quiet">Тихий</option>
      </select>
    </label>
    <button onclick="resetAllCodes()" style="background:#e88a8a; border:none; border-radius:6px; padding:4px 12px; cursor:pointer;">Сбросить все коды</button>
  </div>
  <div class="brand">Универсальный пульт v2.0</div>
</div>

    power: null, mode: null, tempUp: null, tempDown: null, fan: null,

    health: null, clean: null, quiet: null

  // ============================================================
  //  ЗАГРУЗКА / СОХРАНЕНИЕ НАСТРОЕК И КОДОВ
  // ============================================================
  function loadAll() {
    try {
      const saved = localStorage.getItem('univ_remote_data');
      if (saved) {
        const data = JSON.parse(saved);
        if (data.codes) Object.assign(savedCodes, data.codes);
        if (data.settings) Object.assign(settings, data.settings);
        if (data.brand) currentBrand = data.brand;
      }
    } catch(e) {}
  }
  function saveAll() {
    try {
      localStorage.setItem('univ_remote_data', JSON.stringify({
        codes: savedCodes,
        settings: settings,
        brand: currentBrand
      }));
    } catch(e) {}
  }

  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА
  // ============================================================
  function initUI() {
    // Тема
    document.body.className = settings.theme;
    document.getElementById('themeSelect').value = settings.theme;
    // Цвет дисплея
    document.getElementById('displayColor').value = settings.displayColor;
    changeDisplayColor();
    // Чекбоксы
    document.getElementById('vibroCheck').checked = settings.vibro;
    document.getElementById('soundCheck').checked = settings.sound;
    // Выбор марки
    document.getElementById('brandSelect').value = currentBrand;
    // Обновить статус
    document.getElementById('learnStatus').textContent = 'Марка: ' + currentBrand.toUpperCase() + '. Выберите функцию в настройках.';
  }

  // ============================================================
  //  ФУНКЦИИ НАСТРОЕК
  // ============================================================
  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
  }

  function changeTheme() {
    const val = document.getElementById('themeSelect').value;
    settings.theme = val;
    document.body.className = val;
    saveAll();
  }

  function changeDisplayColor() {
    const color = document.getElementById('displayColor').value;
    settings.displayColor = color;
    document.getElementById('display').style.color = color;
    document.getElementById('display').style.borderColor = color;
    // Меняем цвет текста на дисплее
    const elements = document.querySelectorAll('.display, .display-top, .display-temp, .display-mode, .display-extra');
    elements.forEach(el => el.style.color = color);
    saveAll();
  }

  function changeBrand() {
    const brand = document.getElementById('brandSelect').value;
    currentBrand = brand;
    // Очищаем сохранённые коды (потому что для новой марки они другие)
    for (let key in savedCodes) savedCodes[key] = null;
    saveAll();
    document.getElementById('learnStatus').textContent = 'Марка: ' + brand.toUpperCase() + '. Коды сброшены.';
    // Обновляем интерфейс (например, показываем сообщение)
    alert('Выбрана марка ' + brand.toUpperCase() + '. Все ранее найденные коды сброшены. Используйте "Найти код" для каждой функции.');
  }

  function resetAllCodes() {
    if (confirm('Сбросить все сохранённые коды и настройки?')) {
      for (let key in savedCodes) savedCodes[key] = null;
      settings.theme = 'light';
      settings.displayColor = '#a8f0a8';
      settings.vibro = false;
      settings.sound = false;
      saveAll();
      initUI();
      document.getElementById('learnStatus').textContent = 'Все коды сброшены.';
    }
  }

  function saveSettings() {
    settings.vibro = document.getElementById('vibroCheck').checked;
    settings.sound = document.getElementById('soundCheck').checked;
    saveAll();
  }

  // ============================================================
  //  ОТПРАВКА ИК И ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  // ============================================================
  function sendIRCode(frequency, pattern) {
    if (window.irBridge) {
      window.irBridge.sendIR(frequency, pattern);
      console.log('📡 ИК отправлен');
    } else {
      console.warn('⚠️ irBridge не доступен');
    }
  }

  function necPattern(address, command) {
    const bits = [9000, 4500];
    let addr = address & 0xFF;
    let invAddr = (~addr) & 0xFF;
    for (let i = 0; i < 8; i++) bits.push(560, (addr & (1 << i)) ? 1690 : 560);
    for (let i = 0; i < 8; i++) bits.push(560, (invAddr & (1 << i)) ? 1690 : 560);
    let cmd = command & 0xFF;
    let invCmd = (~cmd) & 0xFF;
    for (let i = 0; i < 8; i++) bits.push(560, (cmd & (1 << i)) ? 1690 : 560);
    for (let i = 0; i < 8; i++) bits.push(560, (invCmd & (1 << i)) ? 1690 : 560);
    bits.push(560);
    return bits;
  }

  function vibrate() {
    if (settings.vibro && navigator.vibrate) navigator.vibrate(20);
  }

  function playSound() {
    if (settings.sound) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1000;
        gain.gain.value = 0.1;
        osc.start();
        setTimeout(() => osc.stop(), 50);
      } catch(e) {}
    }
  }

  // ============================================================
  //  УНИВЕРСАЛЬНАЯ ОТПРАВКА СОХРАНЁННОГО КОДА
  // ============================================================
  function sendSavedCode(action) {
    const code = savedCodes[action];
    if (code) {
      const pattern = necPattern(code.address, code.command);
      sendIRCode(38000, pattern);
      vibrate();
      playSound();
      return true;
    } else {
      console.warn('Код для ' + action + ' не найден');
      return false;
    }
  }

  // ============================================================
  //  АВТОПОИСК (УНИВЕРСАЛЬНЫЙ)
  // ============================================================
  let learningActive = false;
  let learnIndex = 0;
  let learnTimer = null;
  let currentAction = null;

  function startLearning() {
    const action = document.getElementById('learnAction').value;
    const brand = currentBrand;
    const db = codeBases[brand];
    if (!db || !db[action] || db[action].length === 0) {
      document.getElementById('learnStatus').textContent = '❌ Нет базы для этой функции';
      return;
    }
    if (learningActive) {
      stopLearning('Остановлено');
      return;
    }
    if (savedCodes[action]) {
      if (!confirm('Код для "' + document.getElementById('learnAction').options[document.getElementById('learnAction').selectedIndex].text + '" уже найден. Перезаписать?')) {
        return;
      }
      savedCodes[action] = null;
      saveAll();
    }

    learningActive = true;
    learnIndex = 0;
    currentAction = action;
    document.getElementById('learnBtn').textContent = '⏹ Остановить';
    document.getElementById('learnStatus').textContent = 'Поиск... (0/' + db[action].length + ')';
    nextLearnCode();
  }

  function nextLearnCode() {
    if (!learningActive || learnIndex >= codeBases[currentBrand][currentAction].length) {
      stopLearning('❌ Коды закончились, не найдено');
      return;
    }
    const entry = codeBases[currentBrand][currentAction][learnIndex];
    const pattern = necPattern(entry.a, entry.c);
    sendIRCode(38000, pattern);
    document.getElementById('learnStatus').textContent = 'Поиск... (' + (learnIndex+1) + '/' + codeBases[currentBrand][currentAction].length + ')';

    learnTimer = setTimeout(() => {
      if (!learningActive) return;
      const userConfirm = confirm('Кондиционер отреагировал? (код #' + (learnIndex+1) + ')');
      if (userConfirm) {
        savedCodes[currentAction] = { address: entry.a, command: entry.c };
        saveAll();
        stopLearning('✅ Код найден!');
        alert('Код сохранён для "' + document.getElementById('learnAction').options[document.getElementById('learnAction').selectedIndex].text + '"');
      } else {
        learnIndex++;
        nextLearnCode();
      }
    }, 3000);
  }

  function stopLearning(message) {
    learningActive = false;
    if (learnTimer) clearTimeout(learnTimer);
    document.getElementById('learnStatus').textContent = message || 'Поиск остановлен';
    document.getElementById('learnBtn').textContent = '🔍 Найти код';
  }

  // ============================================================
  //  ОБРАБОТЧИКИ КНОПОК
  // ============================================================
  function handlePower() {
    if (locked) return;
    power = !power;
    if (!power && timerInterval) { clearInterval(timerInterval); timerInterval = null; timerMinutes = 0; }
    updateUI();
    if (!sendSavedCode('power')) {
      document.getElementById('learnStatus').textContent = '⚠️ Код не найден. Запустите обучение для "Вкл/Выкл"';
    }
  }
  function handleTempUp() {
    if (locked || !power) return;
    if (temperature < 32) temperature++;
    updateUI();
    if (!sendSavedCode('tempUp')) {
      document.getElementById('learnStatus').textContent = '⚠️ Код не найден. Запустите обучение для "Температура +"';
    }
  }
  function handleTempDown() {
    if (locked || !power) return;
    if (temperature > 16) temperature--;
    updateUI();
    if (!sendSavedCode('tempDown')) {
      document.getElementById('learnStatus').textContent = '⚠️ Код не найден. Запустите обучение для "Температура −"';
    }
  }
  function handleMode() {
    if (locked || !power) return;
    modeIndex = (modeIndex + 1) % modes.length;
    updateUI();
    if (!sendSavedCode('mode')) {
      document.getElementById('learnStatus').textContent = '⚠️ Код не найден. Запустите обучение для "Режим"';
    }
  }
  function handleFan() {
    if (locked || !power) return;
    fanIndex = (fanIndex + 1) % fanNames.length;
    updateUI();
    if (!sendSavedCode('fan')) {

    }

  function handleTimer() {
    if (locked || !power) return;
    let val = prompt('Введите время в минутах (0 – выключить):', timerMinutes || '0');
    if (val === null) return;
    let mins = parseInt(val);
    if (isNaN(mins) || mins < 0) mins = 0;
    timerMinutes = mins;
    if (timerInterval) clearInterval(timerInterval);
    if (timerMinutes > 0) {
      timerInterval = setInterval(() => {
        timerMinutes--;
        if (timerMinutes <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          power = false;
          updateUI();
        } else {
          updateUI();
        }
      }, 60000);
      alert('Таймер установлен на ' + timerMinutes + ' мин');
    } else {
      alert('Таймер выключен');
    }
    updateUI();
  }
  function handleReset() {
    if (locked) return;
    power = true;
    temperature = 24;
    modeIndex = 0;
    fanIndex = 0;
    swing = true;
    turbo = false;
    sleep = false;
    iFeel = false;
    displayLight = true;
    health = false;
    clean = false;
    quiet = false;
    if (timerInterval) clearInterval(timerInterval);
    timerMinutes = 0;
    locked = false;
    updateUI();
    alert('Настройки сброшены');
  }
