name: Build APK with IR Support

on:
  push:
    branches: [ "main" ]   # или "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/android

    - name: Create Capacitor project and add Android
      run: |
        mkdir capacitor-app
        cd capacitor-app
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Remote Control" "io.ionic.roda" --web-dir=www
        npx cap add android
        mkdir -p www
        cp -r ../app/* www/
        npx cap sync android

    - name: Replace Android sources with our IR-enabled version
      run: |
        cd capacitor-app
        # Создаём нужные папки, если их нет
        mkdir -p android/app/src/main/java/io/ionic/roda
        # Копируем наши файлы (если они есть) и игнорируем ошибки
        cp ../android/app/src/main/AndroidManifest.xml android/app/src/main/ 2>/dev/null || true
        cp ../android/app/src/main/java/io/ionic/roda/MainActivity.java android/app/src/main/java/io/ionic/roda/ 2>/dev/null || true

    - name: Build APK
      run: |
        cd capacitor-app/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Remote-Control-APK
        path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
