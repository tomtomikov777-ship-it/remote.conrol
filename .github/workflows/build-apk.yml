name: Build APK from HTML

on:
  push:
    branches: [ "main" ]   # если ваша основная ветка называется master, замените main на master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install web-to-apk tool
      run: npm install -g @yaireo/web-to-apk

    - name: Convert HTML to APK
      run: web-to-apk -i index.html -n "RODA Remote" -o app.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v3
      with:
        name: RODA-Remote-APK
        path: app.apk
