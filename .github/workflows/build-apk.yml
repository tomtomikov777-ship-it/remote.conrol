name: Build APK with IR Support

on:
  push:
    branches: [ "main" ]   # или "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/android

    - name: Create Capacitor project and add Android
      run: |
        mkdir capacitor-app
        cd capacitor-app
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "RODA Remote" "io.ionic.roda" --web-dir=www
        npx cap add android
        # Создаём папку www и копируем туда наши файлы
        mkdir -p www
        cp -r ../app/* www/
        # Синхронизируем с Android проектом
        npx cap sync android

    - name: Replace Android sources with our IR-enabled version
      run: |
        cd capacitor-app
        # Удаляем стандартные исходники
        rm -rf android/app/src/main/java/io/ionic/roda/MainActivity.java
        rm -rf android/app/src/main/AndroidManifest.xml
        # Копируем наши файлы из папки android (в корне репозитория)
        cp -r ../android/app/src/main/java/io/ionic/roda/MainActivity.java android/app/src/main/java/io/ionic/roda/
        cp ../android/app/src/main/AndroidManifest.xml android/app/src/main/

    - name: Build APK
      run: |
        cd capacitor-app/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RODA-Remote-IR-APK
        path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
