name: Build APK from HTML

on:
  push:
    branches: [ "main" ]   # или "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK from HTML
      uses: darkshredder/web-to-app-action@main
      with:
        build-folder-path: "app"        # теперь указываем папку app
        app-name: "RODA Remote"
        output-folder-path: "my-apks"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RODA-Remote-APK
        path: my-apks/*.apk
